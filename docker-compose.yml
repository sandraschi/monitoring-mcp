version: "3.8"

# Default: MCP only, talking to host-published Grafana/Prom/Loki.
# Works with Docker Compose and Podman Compose.
# Host gateway: host.docker.internal (Docker Desktop) / host.containers.internal (Podman).

services:
  monitoring-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: monitoring-mcp
    ports:
      - "10786:10851"
    environment:
      - MCP_TRANSPORT=http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=10851
      # Point at host services by default (stack below is optional)
      - MONITORING_MCP_GRAFANA_URL=${MONITORING_MCP_GRAFANA_URL:-http://host.docker.internal:3000}
      - MONITORING_MCP_PROMETHEUS_URL=${MONITORING_MCP_PROMETHEUS_URL:-http://host.docker.internal:9090}
      - MONITORING_MCP_LOKI_URL=${MONITORING_MCP_LOKI_URL:-http://host.docker.internal:3100}
      - MONITORING_MCP_ALERTMANAGER_URL=${MONITORING_MCP_ALERTMANAGER_URL:-http://host.docker.internal:9093}
      - MONITORING_MCP_REQUEST_TIMEOUT=30
      - MONITORING_MCP_MAX_CONCURRENT_REQUESTS=10
      - MONITORING_MCP_MAX_RESULTS_LIMIT=1000
      - MONITORING_MCP_ENABLE_SAMPLING=true
      - MONITORING_MCP_SAMPLING_THRESHOLD=10000
      - MONITORING_MCP_SAMPLING_RATE=0.1
      - MONITORING_MCP_ENABLE_CACHE=true
      - MONITORING_MCP_LOG_LEVEL=INFO
    volumes:
      - ./data:/home/monitoring/.monitoring-mcp
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "host.containers.internal:host-gateway"
    networks:
      - monitoring-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import monitoring_mcp; print('healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional full stack: docker compose --profile stack up -d
  # or: podman compose --profile stack up -d
  grafana:
    profiles: ["stack"]
    image: grafana/grafana:latest
    container_name: monitoring-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - monitoring-network
    restart: unless-stopped

  prometheus:
    profiles: ["stack"]
    image: prom/prometheus:latest
    container_name: monitoring-prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring-network
    restart: unless-stopped

  loki:
    profiles: ["stack"]
    image: grafana/loki:latest
    container_name: monitoring-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring-network
    restart: unless-stopped

  alertmanager:
    profiles: ["stack"]
    image: prom/alertmanager:latest
    container_name: monitoring-alertmanager
    ports:
      - "9093:9093"
    networks:
      - monitoring-network
    restart: unless-stopped

networks:
  monitoring-network:
    driver: bridge
